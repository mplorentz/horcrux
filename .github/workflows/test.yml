name: Tests

on:
  push:
    branches: [main]
  pull_request:
    # Run on all pull requests, regardless of target branch

jobs:
  test:
    name: Run Tests
    runs-on: macos-26 # Pin macOS 26 for golden test rendering (macos-latest is still macOS 15 until June 2026)
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Restore Pub cache with fallback
        uses: actions/cache@v4
        id: pub_cache_restore
        with:
          path: ~/.pub-cache
          # Use explicit path instead of wildcard to avoid macOS hashFiles issues
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
            pub-${{ runner.os }}-

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: ".fvmrc"
          channel: "stable"
          cache: true
          # Use explicit path instead of wildcard to avoid macOS hashFiles issues
          cache-key: flutter-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          pub-cache-key: flutter-pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}

      - name: Save Pub cache (if updated)
        if: steps.pub_cache_restore.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Get dependencies
        run: flutter pub get

      - name: Verify codegen
        # Run codegen and check if generated files changed.
        # Formatting is applied after codegen so generated files are formatted,
        # but format differences between SDK versions are non-blocking since
        # dart_style is SDK-bundled and versions may differ across environments.
        run: |
          flutter pub run build_runner build --delete-conflicting-outputs
          dart format .
          # Only fail on codegen changes (non-generated file diffs from build_runner)
          # Format-only differences are expected when local and CI SDKs differ
          CHANGED=$(git diff --name-only)
          if [ -n "$CHANGED" ]; then
            echo "::warning ::Formatting/codegen differences detected. Files changed: $CHANGED"
            # Check if any changes are from codegen (generated files)
            # Use grep || true to avoid set -e failure when no matches found
            CODEGEN_CHANGED=$(git diff --name-only | grep -E '\.g\.dart|\.mocks\.dart|drift_schemas' || true)
            if [ -n "$CODEGEN_CHANGED" ]; then
              echo "::error ::Codegen is out of date. Run 'flutter pub run build_runner build --delete-conflicting-outputs && dart format .' and commit the changes."
              exit 1
            fi
          fi

      - name: Analyze code
        run: flutter analyze

      - name: Verify drift schema dump is up to date
        # Re-runs `dart run drift_dev schema dump` and diffs against the
        # committed `drift_schemas/`. This catches a stale snapshot but does
        # NOT catch re-dumping into drift_schema_vN.json without bumping N;
        # We have `.github/workflows/drift-schema-version.yml` to catch that.
        run: flutter test test/database/schema_parity_test.dart

      - name: Run unit tests
        # Exclude drift-schema: schema parity runs in "Verify drift schema dump" (shells drift_dev).
        # SQLCipher Zetetic encryption checks also run here but skip unless a
        # SQLCipher dylib is already present; the dedicated job below forces them.
        run: flutter test --exclude-tags=golden,drift-schema

      - name: Run golden tests
        run: flutter test --tags=golden
        id: golden_tests
        # Note: If this fails, it means the rendered UI doesn't match the committed golden images
        # Developer needs to either:
        # 1. Fix the unintended UI change, OR
        # 2. Update goldens: flutter test test/screens --update-goldens

      - name: Upload golden test failures
        if: failure() && steps.golden_tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: golden-test-failures
          path: |
            test/**/failures/
            test/**/goldens/
          retention-days: 7

      - name: Comment on PR with golden test instructions
        if: failure() && steps.golden_tests.outcome == 'failure' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '## ⚠️ Golden Tests Failed\n\nThe golden screenshot tests have failed. This could mean:\n\n1. **Intentional UI changes**: If you updated the UI, you need to update the golden files:\n   ```bash\n   flutter test test/screens --update-goldens\n   git add test/screens/goldens/*.png\n   git commit -m "Update golden test screenshots"\n   ```\n\n2. **Unintentional changes**: Review the diff images in the [test artifacts](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) to see what changed.\n\n3. **Platform differences**: Golden tests must be generated on macOS. If you\'re on Linux/Windows, ask a macOS team member to regenerate them.\n\n📦 Download the failure artifacts above to see before/after comparisons.'
            })

  # Dedicated parallel job for Zetetic SQLCipher encryption verification.
  #
  # Why a separate job (not a step on the main suite):
  # - The main "Run Tests" job already uses macos-26 (goldens need it), but
  #   `flutter test` loads Apple's system SQLite — not SQLCipher — so those
  #   checks skip unless a cipher-capable dylib is injected via
  #   SQLCIPHER_LIBRARY (or a prior `flutter build macos` left build products).
  # - Obtaining SQLCipher via Homebrew is much cheaper than
  #   `flutter build macos` / CocoaPods framework builds, and keeps that cost
  #   off the main critical path (analyze + unit + golden).
  # - REQUIRE_SQLCIPHER=1 makes the job fail-closed if the dylib does not load
  #   (skip-when-unavailable remains the default for local/Linux hosts).
  #
  # Caveats: pays for a second macOS runner in parallel; uses Homebrew
  # SQLCipher (not the app's CocoaPods SQLCipher.framework). That is enough
  # for the advisory scenarios (correct/incorrect/no key + non-plaintext
  # header). No codesigning/certs required.
  sqlcipher_encryption:
    name: SQLCipher encryption verification
    runs-on: macos-26
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: ".fvmrc"
          channel: "stable"
          cache: true
          cache-key: flutter-sqlcipher-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          pub-cache-key: flutter-pub-sqlcipher-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}

      - name: Get dependencies
        run: flutter pub get

      - name: Install SQLCipher (Homebrew)
        run: brew install sqlcipher

      - name: Resolve SQLCipher dylib
        id: sqlcipher_lib
        run: |
          PREFIX="$(brew --prefix sqlcipher)"
          LIB="${PREFIX}/lib/libsqlcipher.dylib"
          if [[ ! -f "$LIB" ]]; then
            echo "::error ::Expected SQLCipher dylib at $LIB"
            ls -la "${PREFIX}/lib" || true
            exit 1
          fi
          echo "path=$LIB" >> "$GITHUB_OUTPUT"
          echo "Using SQLCipher library: $LIB"
          file "$LIB"

      - name: Run Zetetic SQLCipher encryption verification
        env:
          SQLCIPHER_LIBRARY: ${{ steps.sqlcipher_lib.outputs.path }}
          # Fail instead of skip when the library does not activate SQLCipher.
          REQUIRE_SQLCIPHER: "1"
        run: flutter test test/database/sqlcipher_encryption_verification_test.dart
